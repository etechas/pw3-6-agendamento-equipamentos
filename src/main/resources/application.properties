spring.application.name=armarios

# ---- SQL Server (padrão) ----
# Credenciais via variáveis de ambiente: DB_USER e DB_PASSWORD
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=AgendaEquipamentos;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:troque_a_senha}

# A tabela é criada pelo script backend/database/schema.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
